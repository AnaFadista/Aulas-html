<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    
<table border="1">
    <caption>Minha primeira tabela</caption>
<thead>
    <tr>
        <th>Nome</th>        
        <th>Idade</th>        
        <th>Sexo</th>               
    </tr>
</thead>
<tbody>
    <tr>
        <td>Ana</td>
        <td>24</td>
        <td><b>Feminino</b></td>
    </tr>
    <tr>
        <td>Francisco</td>
        <td>20</td>
        <td><b>Masculino</b></td>
    </tr>
</tbody>
<tfoot>
    <td colspan="3">observação ou informação da tabela</td>
</tfoot>
</table>
</body>
</html>
