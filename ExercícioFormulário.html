<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro Formulário</title>
</head>
<body>
    
<form action="servidor.php" method="post">
    <fieldset>
        <legend>Formulário de contactos BYTES</legend>

        <label for="nome">Nome:</label>
        <input type="text" name="caixaNome" id="nome" placeholder="Insira seu nome aqui" required>
<br><br>
        <label for="email">E-mail:</label>
        <input type="email" name="caixaEmail" id="email" placeholder="insira o seu e-mail" required> 
<br><br>        
        <input type="radio" name="genero" id="genero">
        <label for="fem">Feminino</label><br>
          <input type="radio" name="genero" id="genero">
          <label for="masc">Masculino</label>

<br><br>
        <label for="turma">Turma:</label>
        <select name="caixaTurma" id="turma">

            <option value="turma1">tutma 1</option>

            <option value="turma3">Turma 3</option>
        </select>
<br><br>
       <label for="mensagem">Menagem</label>
       <textarea name="caixaMensagem" id="mensagem"></textarea>
<br><br>
       <input type="reset">
       <input type="submit">

    </fieldset>
</form>

</body>
</html>
